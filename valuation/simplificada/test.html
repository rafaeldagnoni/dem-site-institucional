<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>Testes do motor — Calculadora de Valuation D&amp;M Simplificada (uso interno)</title>
<style>
  body { font-family: 'Courier New', monospace; background:#0a0e0b; color:#e8e5de; padding:2rem; font-size:13px; line-height:1.6; }
  h1 { color:#b8945a; font-size:1.3rem; }
  .pass { color:#8fce8f; }
  .fail { color:#ff8a80; font-weight:bold; }
  .summary { position:sticky; top:0; background:#0a0e0b; padding:1rem 0; border-bottom:1px solid #555; z-index:10; font-size:1.1rem; }
</style>
</head>
<body>
<h1>Testes do motor de cálculo — Calculadora de Valuation D&amp;M (versão simplificada)</h1>
<p style="color:#8a8880">Página de uso interno (QA). Não faz parte do site público, não é linkada de nenhum lugar, e não envia nenhum dado para o webhook real.</p>
<div id="summary" class="summary">Rodando testes…</div>
<div id="results"></div>

<script src="engine.js"></script>
<script>
(function () {
  "use strict";
  var E = window.ValuationEngineSimples;
  var results = [];
  var passCount = 0, failCount = 0;

  function assert(desc, condition, extra) {
    results.push({ desc: desc, pass: !!condition, extra: extra || "" });
    if (condition) passCount++; else failCount++;
  }
  function approx(a, b, tolPct) {
    tolPct = tolPct == null ? 0.001 : tolPct;
    if (b === 0) return Math.abs(a) < 1;
    return Math.abs(a - b) / Math.abs(b) <= tolPct;
  }

  function baseInput(overrides) {
    var base = {
      setor: "servicos", periodo: "anual", receita: 1000000,
      lucratividade: "media", crescimento: "crescendo", dependenciaSocio: "media", dividas: 100000
    };
    for (var k in overrides) base[k] = overrides[k];
    return base;
  }

  // ==========================================================================
  // 1) Receita zero -> inválido
  // ==========================================================================
  (function () {
    var r = E.calcularValuationSimples(baseInput({ receita: 0 }));
    assert("1. Receita zero -> inválido, com mensagem", r.valido === false && typeof r.mensagem === "string");
  })();

  // ==========================================================================
  // CASO A — validado em Python: servicos, anual, receita 1M, margem 12%,
  // crescendo, dependência média, dívidas 100k
  // ==========================================================================
  var casoA = E.calcularValuationSimples(baseInput({}));
  assert("A. válido", casoA.valido === true);
  assert("A. margemEstimada = false (margem informada)", casoA.margemEstimada === false);
  assert("A. ebitda ≈ 120.000", approx(casoA.ebitda, 120000));
  assert("A. multiploAjustado ≈ 4.2351", approx(casoA.multiploAjustado, 4.23509856));
  assert("A. enterpriseValue ≈ 508.211,83", approx(casoA.enterpriseValue, 508211.8272));
  assert("A. valorBase ≈ 408.211,83", approx(casoA.valorBase, 408211.8272), "obtido=" + casoA.valorBase);
  assert("A. valorMin ≈ 306.158,87 (amplitude 25%)", approx(casoA.valorMin, 306158.8704));
  assert("A. valorMax ≈ 510.264,78 (amplitude 25%)", approx(casoA.valorMax, 510264.784));
  assert("A. observação final padrão sempre presente", casoA.observacoes.indexOf("Esta é a versão simplificada. A versão completa considera EBITDA real, fluxo de caixa descontado, ativos, passivos fiscais e governança — e entrega uma faixa mais estreita.") !== -1);
  assert("A. sem observação de margem estimada (margem foi informada)", casoA.observacoes.length === 1);

  // ==========================================================================
  // CASO B — validado em Python: tecnologia, MENSAL (anualiza x12), margem
  // "não sei" (estimada pelo setor com desconto), acelerado, dependência alta,
  // sem dívidas
  // ==========================================================================
  var casoB = E.calcularValuationSimples({
    setor: "tecnologia", periodo: "mensal", receita: 500000,
    lucratividade: "naosei", crescimento: "acelerado", dependenciaSocio: "alta", dividas: 0
  });
  assert("B. receitaAnual == receita mensal x12 (6.000.000)", approx(casoB.receitaAnual, 6000000));
  assert("B. margemEstimada = true (marcou 'não sei')", casoB.margemEstimada === true);
  assert("B. margemUsada ≈ 20% (25% de referência x 0.8 de prudência)", approx(casoB.margemUsada, 0.20));
  assert("B. ebitda ≈ 1.200.000", approx(casoB.ebitda, 1200000));
  assert("B. multiploAjustado ≈ 7.1215", approx(casoB.multiploAjustado, 7.121536));
  assert("B. valorBase ≈ 8.545.843,20 (sem dívidas)", approx(casoB.valorBase, 8545843.2), "obtido=" + casoB.valorBase);
  assert("B. amplitude 35% (margem estimada) -> valorMin ≈ 5.554.798,08", approx(casoB.valorMin, 5554798.08));
  assert("B. amplitude 35% (margem estimada) -> valorMax ≈ 11.536.888,32", approx(casoB.valorMax, 11536888.32));
  assert("B. observação de margem estimada presente", casoB.observacoes.some(function (o) { return o.indexOf("margem média do setor") !== -1; }));
  assert("B. observação de dependência alta presente", casoB.observacoes.some(function (o) { return o.indexOf("principal fator de desconto") !== -1; }));

  // ==========================================================================
  // CASO C — validado em Python: prejuízo (margem 0), empresa grande (fator de
  // porte no teto 1.20), dívidas MAIORES que o enterprise value
  // ==========================================================================
  var casoC = E.calcularValuationSimples({
    setor: "outros", periodo: "anual", receita: 200000000,
    lucratividade: "prejuizo", crescimento: "queda", dependenciaSocio: "baixa", dividas: 100000000
  });
  assert("C. ebitda == 0 (prejuízo)", casoC.ebitda === 0);
  assert("C. enterpriseValue == 0 (EBITDA nulo)", casoC.enterpriseValue === 0);
  assert("C. valorBase == 0 (nunca negativo)", casoC.valorBase === 0);
  assert("C. valorMin == 0", casoC.valorMin === 0);
  assert("C. observação de lucro nulo/negativo presente", casoC.observacoes.some(function (o) { return o.indexOf("patrimônio e da carteira de clientes") !== -1; }));

  // ==========================================================================
  // CASO D — validado em Python: dívidas muito maiores que o enterprise value
  // isolado (sem prejuízo) -> valorBase ainda assim nunca fica negativo
  // ==========================================================================
  var casoD = E.calcularValuationSimples({
    setor: "atacado", periodo: "anual", receita: 300000,
    lucratividade: "baixa", crescimento: "estavel", dependenciaSocio: "media", dividas: 999999999
  });
  assert("D. enterpriseValue > 0 mas dívida absurda", casoD.enterpriseValue > 0);
  assert("D. valorBase nunca negativo (clamp em 0)", casoD.valorBase === 0);
  assert("D. valorMin nunca negativo", casoD.valorMin === 0);

  // ==========================================================================
  // 2) Dívida > 50% do enterprise value (mas não o supera) -> alerta específico
  // ==========================================================================
  (function () {
    var r = E.calcularValuationSimples(baseInput({ dividas: 400000 })); // EV do caso A ≈ 508.211
    assert("2. Dívida > 50% do EV -> observação de reorganizar passivo presente", r.observacoes.some(function (o) { return o.indexOf("consome parcela relevante do valor") !== -1; }));
  })();
  (function () {
    var r = E.calcularValuationSimples(baseInput({ dividas: 50000 })); // bem abaixo de 50% do EV
    assert("2b. Dívida baixa -> SEM observação de reorganizar passivo", !r.observacoes.some(function (o) { return o.indexOf("consome parcela relevante do valor") !== -1; }));
  })();

  // ==========================================================================
  // 3) Setor inexistente -> cai no último da lista ("Outro segmento"), não quebra
  // ==========================================================================
  (function () {
    var r = E.calcularValuationSimples(baseInput({ setor: "setor_que_nao_existe_xyz" }));
    assert("3. Setor desconhecido -> não quebra, usa fallback 'Outro segmento'", r.valido === true && r.setorLabel === "Outro segmento");
  })();

  // ==========================================================================
  // 4) Fator total nunca sai do clamp [0.45, 1.60] e múltiplo nunca sai de [1.5, 12]
  // ==========================================================================
  (function () {
    // combinação de piores fatores possíveis (porte pequeno, queda, dependência alta)
    var r = E.calcularValuationSimples({ setor: "atacado", periodo: "anual", receita: 100000, lucratividade: "media", crescimento: "queda", dependenciaSocio: "alta", dividas: 0 });
    assert("4a. multiploAjustado nunca abaixo de 1.5x", r.multiploAjustado >= 1.5 - 1e-9);
  })();
  (function () {
    // combinação dos melhores fatores possíveis + setor de maior múltiplo (tecnologia 8.0x)
    var r = E.calcularValuationSimples({ setor: "tecnologia", periodo: "anual", receita: 100000000, lucratividade: "alta", crescimento: "acelerado", dependenciaSocio: "baixa", dividas: 0 });
    assert("4b. multiploAjustado nunca acima de 12x", r.multiploAjustado <= 12 + 1e-9, "obtido=" + r.multiploAjustado);
  })();

  // ==========================================================================
  // 5) Todos os 14 setores existem e têm múltiplo/margem de referência válidos
  // ==========================================================================
  (function () {
    var ok = E.SETORES.length === 14 && E.SETORES.every(function (s) { return s.multiplo > 0 && s.margemRef > 0; });
    assert("5. 14 setores cadastrados, todos com múltiplo e margem de referência positivos", ok, "total=" + E.SETORES.length);
  })();

  // ==========================================================================
  // 6) Ajustes exibidos sempre em 4 itens, na ordem esperada
  // ==========================================================================
  (function () {
    var r = E.calcularValuationSimples(baseInput({}));
    var labels = r.ajustes.map(function (a) { return a.label; });
    assert("6. 4 fatores de ajuste, na ordem: porte, trajetória, dependência, informação", labels.length === 4 &&
      labels[0] === "Porte do faturamento" && labels[1] === "Trajetória de vendas" &&
      labels[2] === "Dependência do dono" && labels[3] === "Nível de informação disponível");
  })();

  // ==========================================================================
  // Render
  // ==========================================================================
  var summary = document.getElementById("summary");
  var el = document.getElementById("results");
  results.forEach(function (r) {
    var div = document.createElement("div");
    div.className = r.pass ? "pass" : "fail";
    div.textContent = (r.pass ? "✓ PASS — " : "✗ FAIL — ") + r.desc + (r.extra ? "  [" + r.extra + "]" : "");
    el.appendChild(div);
  });
  summary.innerHTML = "<strong>" + passCount + " passaram / " + failCount + " falharam</strong> (total " + results.length + ")";
  summary.className = "summary " + (failCount === 0 ? "pass" : "fail");
  window.__TEST_SUMMARY__ = { pass: passCount, fail: failCount, total: results.length, results: results };
})();
</script>
</body>
</html>
